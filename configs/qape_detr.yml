# QAPE-DETR: original LGP + ECR + QAF-lite experiment settings.
__include__: [
  'dataset/calf_detection.yml',
  'runtime.yml',
  'base/dataloader.yml',
  'base/optimizer.yml',
  'base/deimv2.yml'
]

output_dir: ./outputs/qape_detr
#LGP+ECR+QAF-lite
DEIM:
  backbone: HGNetv2
  encoder: LiteEncoder
  decoder: DEIMTransformer

HGNetv2:
  name: 'Atto'
  return_idx: [2]
  freeze_at: -1
  freeze_norm: False
  use_lab: True

LiteEncoder:
  in_channels: [256]
  feat_strides: [16]
  hidden_dim: 64
  expansion: 0.34
  depth_mult: 0.5
  act: 'silu'
  use_lgp: True
  use_ecr: True
  use_qaf_lite: True
  q_dim: 16
  lgp_pool_ks: 3

DEIMTransformer:
  feat_channels: [64, 64]
  feat_strides: [16, 32]
  hidden_dim: 64
  num_levels: 2
  num_points: [4, 2]
  num_layers: 3
  eval_idx: -1
  num_queries: 100
  dim_feedforward: 160
  share_bbox_head: True

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.0004
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.0004
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0008
  betas: [0.9, 0.999]
  weight_decay: 0.0001

epoches: 100
warmup_iter: 200
flat_epoch: 54
no_aug_epoch: 8
lr_gamma: 1.0

train_dataloader:
  dataset:
    transforms:
      policy:
        epoch: [3, 49, 93]

  collate_fn:
    ema_restart_decay: 0.9999
    base_size_repeat: ~
    mixup_prob: 0.0
    mixup_epochs: [0]
    stop_epoch: 193
    copyblend_prob: 0.0
    copyblend_epochs: [0]
    area_threshold: 100
    num_objects: 3
    with_expand: True
    expand_ratios: [0.1, 0.25]

DEIMCriterion:
  matcher:
    change_matcher: True
    iou_order_alpha: 4.0
    matcher_change_epoch: 85

val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: data/val
    ann_file: data/annotations/val_coco.json
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
  shuffle: False
  total_batch_size: 64
  num_workers: 4
  drop_last: False
  collate_fn:
    type: BatchImageCollateFunction

test_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: data/test
    ann_file: data/annotations/test_coco.json
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
  shuffle: False
  total_batch_size: 64
  num_workers: 4
  drop_last: False
  collate_fn:
    type: BatchImageCollateFunction